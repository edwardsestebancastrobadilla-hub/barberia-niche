function pextra(m){var v=parseInt($("im").value,10);if(!(v>0)){alert("Escribe un monto válido.");return}

function pcobrar(id,m){var v=parseInt($("mp").value,10);if(!(v>0)){alert("Escribe un monto válido.");return}
rpc("panel_cobrar",{p_slug:SLUG,p_pin:PIN,p_cita:id,p_monto:v,p_metodo:m}).then(function(){QC=null;panel()}).catch(function(){alert("No se pudo registrar el cobro.")})}
function pdel(id){if(!confirm("¿Borrar este ingreso?"))return;rpc("panel_borrar_ingreso",{p_slug:SLUG,p_pin:PIN,p_id:id}).then(function(){loadIng();panel()})}
var AS=null;
function toMin(s){var a=String(s||"").split(":");return a.length<2?-1:(+a[0])*60+(+a[1])}
function t2s(m){return ("0"+Math.floor(m/60)).slice(-2)+":"+("0"+m%60).slice(-2)}
function daySlots(d){
var dt=new Date(d+"T12:00:00");if(HZ.dias.indexOf(dt.getDay())<0)return [];
var a=[],i=toMin(HZ.ini),f=toMin(HZ.fin),p=HZ.paso||60,di=toMin(HZ.di),df=toMin(HZ.df);
for(var m=i;m<=f;m+=p){if(di>=0&&df>di&&m>=di&&m<df)continue;a.push(m)}
return a}
function firstDate(){
var n=new Date(),nm=n.getHours()*60+n.getMinutes();
for(var k=0;k<21;k++){var d=dstr(k),sl=daySlots(d).filter(function(m){return k>0||m>nm});if(sl.length)return d}
return iso}
function hzHtml(){var h=AS.hz,D=[[1,"L"],[2,"M"],[3,"X"],[4,"J"],[5,"V"],[6,"S"],[0,"D"]];
return '<h2>Horario de atención</h2><div class="row" style="gap:8px"><div style="flex:1"><div class="sub" style="margin:0 0 4px">Abre</div><input type="time" value="'+esc(h.ini)+'" oninput="AS.hz.ini=this.value"></div><div style="flex:1"><div class="sub" style="margin:0 0 4px">Última cita</div><input type="time" value="'+esc(h.fin)+'" oninput="AS.hz.fin=this.value"></div></div>'
+'<div class="sub" style="margin:4px 0">Duración de cada cita</div><select onchange="AS.hz.paso=+this.value">'+[15,20,30,45,60,90,120].map(function(p){return '<option value="'+p+'"'+(h.paso==p?' selected':'')+'>'+p+' minutos</option>'}).join("")+'</select>'
+'<div class="sub" style="margin:4px 0">Días que atiendes</div><div class="qr" style="margin:0 0 10px">'+D.map(function(d){return '<button class="'+(h.dias.indexOf(d[0])>=0?'on':'')+'" onclick="hzDay('+d[0]+')">'+d[1]+'</button>'}).join("")+'</div>'
+'<div class="sub" style="margin:4px 0">Descanso (opcional, ej. almuerzo): desde y hasta</div><div class="row" style="gap:8px"><input type="time" value="'+esc(h.di||"")+'" oninput="AS.hz.di=this.value"><input type="time" value="'+esc(h.df||"")+'" oninput="AS.hz.df=this.value"></div>'}
function hzDay(d){var a=AS.hz.dias,i=a.indexOf(d);if(i>=0){if(a.length>1)a.splice(i,1)}else a.push(d);drawAj()}
function loadAj(){rpc("panel_config",{p_slug:SLUG,p_pin:PIN}).then(function(c){AS={n:c.nombre,w:c.whatsapp,sv:c.servicios.map(function(x){return {n:x.n,p:x.p}}),bb:c.barberos.slice(),mp:c.mostrar_precios!==false,hz:Object.assign({ini:"09:00",fin:"18:00",paso:60,dias:[0,1,2,3,4,5,6],di:"",df:""},c.horario||{})};drawAj()}).catch(function(){$("paj").innerHTML='<div class="msg e">No se pudieron cargar los ajustes. ¿Ya ejecutaste el SQL de ajustes?</div>'})}
function drawAj(){
$("paj").innerHTML='<h2>Datos del negocio</h2><input value="'+esc(AS.n)+'" placeholder="Nombre" oninput="AS.n=this.value"><input type="tel" value="'+esc(AS.w)+'" placeholder="WhatsApp (ej: 50688881234)" oninput="AS.w=this.value">'
+'<h2>Servicios y precios</h2>'+AS.sv.map(function(x,i){return '<div class="row" style="margin-bottom:6px"><input value="'+esc(x.n)+'" placeholder="Servicio" oninput="AS.sv['+i+'].n=this.value" style="margin:0;flex:2"><input type="number" inputmode="numeric" value="'+esc(String(x.p))+'" placeholder="₡" oninput="AS.sv['+i+'].p=this.value" style="margin:0;flex:1"><button class="del" onclick="ajDel('+i+')">✕</button></div>'}).join("")
+'<button style="width:100%;margin:6px 0" onclick="AS.sv.push({n:\'\',p:\'\'});drawAj()">+ Agregar servicio</button>'
+'<label class="row" style="justify-content:flex-start;gap:10px;margin:8px 0"><input type="checkbox" style="width:auto;margin:0" '+(AS.mp?'checked':'')+' onchange="AS.mp=this.checked"> Mostrar precios a los clientes</label>'
+'<h2>Profesionales</h2>'+AS.bb.map(function(x,i){return '<div class="row" style="margin-bottom:6px"><input value="'+esc(x)+'" placeholder="Nombre del profesional" oninput="AS.bb['+i+']=this.value" style="margin:0"><button class="del" onclick="ajDelB('+i+')">✕</button></div>'}).join("")
+'<button style="width:100%;margin:6px 0" onclick="AS.bb.push(\'\');drawAj()">+ Agregar profesional</button>'
+hzHtml()+'<button class="pri" style="width:100%;margin-top:10px" onclick="ajSave()">Guardar cambios</button><div id="ajm"></div>';
}
function ajDel(i){if(AS.sv.length>1){AS.sv.splice(i,1);drawAj()}}
function ajDelB(i){if(AS.bb.length>1){AS.bb.splice(i,1);drawAj()}}
function ajSave(){
var sv=AS.sv.map(function(x){return {n:String(x.n).trim(),p:parseInt(x.p,10)}}),bb=AS.bb.map(function(x){return String(x).trim()});
if(sv.some(function(x){return !x.n||!(x.p>=0)})||bb.some(function(x){return !x})){$("ajm").innerHTML='<div class="msg e">Revisa que cada servicio tenga nombre y precio, y cada profesional un nombre.</div>';return}
var hz={ini:AS.hz.ini,fin:AS.hz.fin,paso:+AS.hz.paso,dias:AS.hz.dias,di:AS.hz.di||"",df:AS.hz.df||""};
if(toMin(hz.ini)<0||toMin(hz.fin)<=toMin(hz.ini)||((hz.di||hz.df)&&!(toMin(hz.di)>=0&&toMin(hz.df)>toMin(hz.di)))){$("ajm").innerHTML='<div class="msg e">Revisa el horario: la última cita debe ser después de la apertura, y el descanso necesita inicio y fin.</div>';return}
rpc("panel_guardar_v2",{p_slug:SLUG,p_pin:PIN,p_nombre:AS.n,p_whatsapp:AS.w,p_servicios:sv,p_barberos:bb,p_mostrar:AS.mp,p_horario:hz}).then(function(){
BN=AS.n.trim();OWNER_WA=AS.w.replace(/\D/g,"");MP=AS.mp;SV=sv.map(function(x){return [x.n,x.p]});BA=["Cualquiera"].concat(bb);S.s=0;S.b=bb.length==1?1:0;
setTitle(BN);document.title=BN+" - Reserva tu cita";HZ=hz;S.t=null;$("date").value=firstDate();drawOpts();loadOcc();$("ajm").innerHTML='<div class="msg">Guardado ✓ Los clientes ya ven los cambios.</div>'
}).catch(function(){$("ajm").innerHTML='<div class="msg e">No se pudo guardar. Revisa los datos e intenta de nuevo.</div>'})}
function lock(){
$("m").innerHTML='<h1>'+esc(BN)+'</h1><div class="card" style="margin-top:20px;text-align:center"><h2>🔒 Servicio suspendido</h2><p class="sub">El período de prueba terminó. Para reactivar la app, paga la suscripción mensual de <b>₡15.000</b> por SINPE Móvil:</p><div class="card"><b>6376-6625</b><br>Edwards Esteban Castro Badilla</div><p class="sub">Luego envía el comprobante por WhatsApp y se reactiva.</p><a class="wa" target="_blank" rel="noopener" href="https://wa.me/'+DEV_WA+'?text='+encodeURIComponent("Hola, hice el pago SINPE de la suscripción de "+BN+". Adjunto el comprobante.")+'">Enviar comprobante por WhatsApp</a></div>';
}
function boot(){
if(!SLUG){$("st").innerHTML='<div class="msg e">Abre el enlace que te dio tu negocio para reservar tu cita.</div>';return}
rpc("info_barberia",{p_slug:SLUG}).then(function(i){
if(!i){$("st").innerHTML='<div class="msg e">Negocio no encontrado. Revisa el enlace.</div>';return}
BN=i.nombre;MP=i.mostrar_precios!==false;OWNER_WA=i.whatsapp;document.title=BN+" - Reserva tu cita";setTitle(BN);
SV=i.servicios.map(function(x){return [x.n,x.p]});BA=["Cualquiera"].concat(i.barberos);if(i.barberos.length==1)S.b=1;if(i.horario&&i.horario.ini)HZ=i.horario;
if(iso>i.pagado_hasta){lock();return}
$("st").classList.add("hide");$("app").classList.remove("hide");
$("date").min=iso;$("date").value=firstDate();$("date").onchange=function(){S.t=null;loadOcc()};
var cl=ld("cli",null);if(cl){$("name").value=cl.n;$("phone").value=cl.p}
drawOpts();loadOcc();
}).catch(function(){$("st").innerHTML='<div class="msg e">No se pudo conectar. Revisa tu internet e intenta de nuevo.</div>'});
}
var AP=null;

$("m").innerHTML='<div style="display:flex;align-items:center;gap:12px">'+LOGO(44)+'<h1 style="margin:0">Quedó</h1></div><p class="sub" style="margin-top:6px">Panel de administrador</p><div id="adm"><input id="apin" type="password" placeholder="PIN de administrador"><button class="pri" style="width:100%" onclick="aLogin()">Entrar</button></div>';
}
function aLogin(){AP=$("apin").value;aList()}
function aList(){
rpc("admin_lista",{p_pin:AP}).then(function(r){
$("adm").innerHTML=r.map(function(b){var v=b.pagado_hasta<iso;return '<div class="card"><b>'+esc(b.nombre)+'</b><br><small>'+esc(b.slug)+' · '+(v?'VENCIDA el ':'activa hasta ')+b.pagado_hasta+'</small><div class="qr"><a href="#" onclick="aExt(\''+b.slug+'\',7);return false">+7 días</a><a href="#" onclick="aExt(\''+b.slug+'\',30);return false">+30 días</a><a href="#" onclick="aCopy(\''+b.slug+'\');return false">Copiar enlace</a></div></div>'}).join("")+'<h2>Nuevo negocio</h2><input id="ns" placeholder="Código del enlace (ej: elite)"><input id="nn" placeholder="Nombre del negocio"><input id="nw" type="tel" placeholder="WhatsApp (ej: 50688881234)"><input id="np" placeholder="PIN del dueño (mínimo 4)"><button class="pri" style="width:100%" onclick="aNew()">Crear (7 días de prueba)</button><div id="amsg"></div>';
}).catch(function(e){$("adm").insertAdjacentHTML("afterbegin",'<div class="msg e">'+(e.msg=="pin"?"PIN incorrecto":"Error de conexión")+'</div>')})}
function aExt(s,d){rpc("admin_extender",{p_pin:AP,p_slug:s,p_dias:d}).then(aList)}

function aNew(){
rpc("admin_crear",{p_pin:AP,p_slug:$("ns").value.trim().toLowerCase(),p_nombre:$("nn").value,p_whatsapp:$("nw").value,p_pin_barbero:$("np").value}).then(aList).catch(function(){$("amsg").innerHTML='<div class="msg e">No se pudo crear. El código usa solo minúsculas, números y guiones (mínimo 3), y puede estar repetido.</div>'});
}
if(Q.has("admin"))adminUI();else boot();
if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(function(){});
